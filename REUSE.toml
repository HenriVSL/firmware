version = 1
SPDX-PackageName = "deltamm"
SPDX-PackageSupplier = "Tommi Tauriainen"

# Project docs and plain config files where an inline header would be noise.
[[annotations]]
path = [
    "README.md",
    "AGENTS.md",
    "ARCHITECTURE.md",
    "CREDITS.md",
    "docs/**",
    "CMakePresets.json",
    ".clang-format",
    ".clang-tidy",
    ".gitignore",
    ".github/**",
]
SPDX-FileCopyrightText = "2026 Tommi Tauriainen"
SPDX-License-Identifier = "MIT"

# The Spleen bitmap font by Frederic Cambus, as released (2.1.0).
[[annotations]]
path = ["third_party/spleen/**"]
SPDX-FileCopyrightText = "2018-2024 Frederic Cambus"
SPDX-License-Identifier = "BSD-2-Clause"

# Docs added with codeplug programming.
[[annotations]]
path = ["docs/hw-tests/programming.md"]
SPDX-FileCopyrightText = "2026 Henri Lavikainen"
SPDX-License-Identifier = "MIT"

# Docs added with DMR roaming.
[[annotations]]
path = ["docs/hw-tests/roaming.md"]
SPDX-FileCopyrightText = "2026 Henri Lavikainen"
SPDX-License-Identifier = "MIT"
